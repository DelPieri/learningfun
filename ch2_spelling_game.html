<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chapter 2 Dictation Master (30 Words) 🌍</title>
    <style>
        :root {
            --primary: #27ae60;
            --primary-dark: #1e8449;
            --accent: #f39c12;
            --bg: #eafaf1;
            --card-bg: #ffffff;
            --text: #2c3e50;
            --error: #e74c3c;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .game-card {
            background: var(--card-bg);
            width: 100%;
            max-width: 650px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.12);
            padding: 30px;
            box-sizing: border-box;
            text-align: center;
            border: 3px solid #abebc6;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px dashed #d5f5e3;
        }

        .badge {
            background-color: #d5f5e3;
            color: var(--primary-dark);
            padding: 6px 14px;
            border-radius: 15px;
            font-weight: bold;
            font-size: 0.9em;
        }

        .score-box {
            font-size: 1.1em;
            font-weight: bold;
            color: var(--primary-dark);
        }

        h1 {
            color: var(--primary-dark);
            margin: 5px 0 15px 0;
            font-size: 1.7em;
        }

        .attempts-tracker {
            display: inline-block;
            background-color: #fef9e7;
            color: #d35400;
            padding: 5px 12px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 0.9em;
            margin-bottom: 15px;
        }

        .clue-box {
            background-color: #f4fbf7;
            border-left: 5px solid var(--primary);
            border-radius: 10px;
            padding: 18px;
            margin-bottom: 20px;
            text-align: left;
        }

        .sentence {
            font-size: 1.15em;
            line-height: 1.5;
            margin-bottom: 8px;
        }

        .definition {
            font-size: 0.9em;
            color: #7f8c8d;
            font-style: italic;
        }

        .audio-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.95em;
            font-weight: bold;
            margin-bottom: 20px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: transform 0.1s;
        }

        .audio-btn:hover {
            background-color: var(--primary-dark);
            transform: scale(1.03);
        }

        .input-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 15px;
        }

        input[type="text"] {
            font-size: 1.2em;
            padding: 10px 15px;
            border: 2px solid #a9dfbf;
            border-radius: 10px;
            width: 65%;
            text-align: center;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
        }

        .btn-submit {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1em;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
        }

        .btn-submit:hover {
            background-color: var(--primary-dark);
        }

        .feedback {
            min-height: 50px;
            font-size: 1.05em;
            font-weight: bold;
            padding: 10px;
            border-radius: 8px;
            margin-top: 10px;
        }

        .feedback.correct {
            color: #1e8449;
            background-color: #d5f5e3;
        }

        .feedback.warning {
            color: #d35400;
            background-color: #fdebd0;
        }

        .feedback.reveal {
            color: #c0392b;
            background-color: #fadbd8;
        }

        .progress-bar-container {
            width: 100%;
            height: 8px;
            background-color: #eaeded;
            border-radius: 4px;
            margin-top: 20px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background-color: var(--primary);
            transition: width 0.3s;
        }

        .results-screen {
            display: none;
        }

        .restart-btn {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1em;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="game-card">
    <div id="game-screen">
        <div class="header">
            <span class="badge" id="word-count-badge">Word 1 of 30</span>
            <span class="score-box">⭐ Score: <span id="score">0</span></span>
        </div>

        <h1>Earth Day Eco-Spelling 🌿</h1>
        <div class="attempts-tracker" id="attempts-display">Attempts Left: 3/3</div>

        <div class="clue-box">
            <div class="sentence" id="sentence">Loading...</div>
            <div class="definition" id="definition">Loading...</div>
        </div>

        <button class="audio-btn" onclick="speakCurrentWord()">
            🔊 Listen Word
        </button>

        <form id="spelling-form" onsubmit="checkAnswer(event)">
            <div class="input-group">
                <input type="text" id="user-input" placeholder="Type answer here..." autocomplete="off" autofocus />
                <button type="submit" class="btn-submit" id="submit-btn">Check 🚀</button>
            </div>
        </form>

        <div class="feedback" id="feedback"></div>

        <div class="progress-bar-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>
    </div>

    <div class="results-screen" id="results-screen">
        <h2>🎉 Dictation Practice Complete!</h2>
        <p style="font-size: 1.2em;">Great job practicing all 30 Chapter 2 words!</p>
        <p style="font-size: 1.5em; font-weight: bold; color: var(--primary-dark);" id="final-score"></p>
        <button class="restart-btn" onclick="restartGame()">Practice Again 🔄</button>
    </div>
</div>

<script>
    const quizData = [
        // Original 15 Words
        { word: "launched", sentence: "Earth Day was officially ________ in 1970 in the USA.", definition: "Meaning: Formally introduced or started." },
        { word: "enact", sentence: "The government passed laws to ________ clean air and water standards.", definition: "Meaning: To make a bill into official law." },
        { word: "endangered", sentence: "We must pass laws to protect ________ species from extinction.", definition: "Meaning: At risk of becoming extinct." },
        { word: "establish", sentence: "They decided to ________ the Environmental Protection Agency.", definition: "Meaning: To set up or create an organization." },
        { word: "investigate", sentence: "The role of the agency is to ________ environmental issues.", definition: "Meaning: To research or examine issues systematically." },
        { word: "enforce", sentence: "Officers work hard to ________ environmental laws.", definition: "Meaning: To compel obedience to laws." },
        { word: "contribution", sentence: "An eco-action makes a positive ________ to our environment.", definition: "Meaning: An action that helps achieve a goal." },
        { word: "internationally", sentence: "Earth Day was launched ________ across many nations in 1990.", definition: "Meaning: Across or involving multiple countries." },
        { word: "participate", sentence: "About 200 million people ________ in Earth Day activities.", definition: "Meaning: To take part or be involved in an activity." },
        { word: "campaigns", sentence: "They organized clean-up ________ and environmental walks.", definition: "Meaning: Series of organized activities toward a goal." },
        { word: "dedicated", sentence: "These eco-heroes are ________ to preserving our planet.", definition: "Meaning: Devoted entirely to a specific purpose." },
        { word: "preserve", sentence: "We need to ________ Earth for future generations.", definition: "Meaning: To protect and keep safe from harm." },
        { word: "founder", sentence: "Shimon Schwarzschild is the ________ of Action for Nature.", definition: "Meaning: A person who creates or sets up an organization." },
        { word: "protest", sentence: "He started a campaign to ________ the hunting of songbirds.", definition: "Meaning: To publicly express disapproval or objection." },
        { word: "organisations", sentence: "An increasing number of eco-________ have been established.", definition: "Meaning: Groups of people organized for a specific purpose." },
        
        // Additional 15 Words from Image
        { word: "atmosphere", sentence: "Pollution in the air affects Earth's ________ and climate.", definition: "Meaning (n.): The layer of gases surrounding the Earth." },
        { word: "waterways", sentence: "Trash in rivers and streams pollutes local ________.", definition: "Meaning (n.): Rivers, canals, or other bodies of water." },
        { word: "inspired", sentence: "Earth Day ________ millions of people around the world.", definition: "Meaning (v.): Filled someone with the desire to act." },
        { word: "environmental", sentence: "The EPA investigates ________ issues to keep nature safe.", definition: "Meaning (adj.): Relating to the natural world." },
        { word: "celebrated", sentence: "Every year, Earth Day is ________ on April 22nd.", definition: "Meaning (v.): Honored or observed with special events." },
        { word: "communities", sentence: "People in local ________ participate in green projects.", definition: "Meaning (n.): Groups of people living in the same area." },
        { word: "planet", sentence: "It is essential to take care of ________ Earth.", definition: "Meaning (n.): A large celestial body orbiting a star." },
        { word: "completion", sentence: "The ceremony marked the ________ of the new temple.", definition: "Meaning (n.): The state of finishing something." },
        { word: "inspire", sentence: "Eco-heroes want to ________ young people to protect nature.", definition: "Meaning (v.): To motivate or give enthusiasm to others." },
        { word: "throughout", sentence: "They organise environmental activities ________ the year.", definition: "Meaning (adv.): In every part or during the whole period of." },
        { word: "countries", sentence: "Over 170 ________ take part in Earth Day events.", definition: "Meaning (n.): Nations with their own territories and governments." },
        { word: "officially", sentence: "Earth Day was ________ launched worldwide in 1990.", definition: "Meaning (adv.): Formally or authorized by authority." },
        { word: "resources", sentence: "People donate their time and ________ to preserve nature.", definition: "Meaning (v./n.): Assets or supplies that can be drawn on." },
        { word: "encourages", sentence: "Action for Nature ________ kids to take action for Earth.", definition: "Meaning (v.): Gives support, confidence, or hope to someone." },
        { word: "discovered", sentence: "He ________ that songbirds were being hunted illegally.", definition: "Meaning (v.): Found out or learned something new." }
    ];

    let currentIndex = 0;
    let score = 0;
    let attemptsLeft = 3;

    function loadQuestion() {
        attemptsLeft = 3;
        const item = quizData[currentIndex];
        document.getElementById("user-input").value = "";
        document.getElementById("user-input").disabled = false;
        document.getElementById("submit-btn").disabled = false;
        document.getElementById("feedback").textContent = "";
        document.getElementById("feedback").className = "feedback";
        
        document.getElementById("word-count-badge").textContent = `Word ${currentIndex + 1} of ${quizData.length}`;
        document.getElementById("sentence").textContent = item.sentence;
        document.getElementById("definition").textContent = item.definition;
        document.getElementById("attempts-display").textContent = `Attempts Left: ${attemptsLeft}/3`;

        const progressPercent = (currentIndex / quizData.length) * 100;
        document.getElementById("progress-bar").style.width = progressPercent + "%";

        setTimeout(() => speakCurrentWord(), 300);
    }

    function speakCurrentWord() {
        const word = quizData[currentIndex].word;
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(word);
            const voices = window.speechSynthesis.getVoices();
            
            let selectedVoice = voices.find(v => 
                v.lang.startsWith('en') && 
                (v.name.includes('Natural') || v.name.includes('Google') || v.name.includes('Enhanced') || v.name.includes('Samantha'))
            ) || voices.find(v => v.lang.startsWith('en'));

            if (selectedVoice) utterance.voice = selectedVoice;
            utterance.lang = 'en-US';
            utterance.rate = 0.9;
            window.speechSynthesis.speak(utterance);
        }
    }

    function checkAnswer(e) {
        e.preventDefault();
        const userInput = document.getElementById("user-input").value.trim().toLowerCase();
        const targetWord = quizData[currentIndex].word.toLowerCase();
        const feedbackEl = document.getElementById("feedback");

        if (!userInput) return;

        if (userInput === targetWord) {
            let addedPoints = attemptsLeft === 3 ? 10 : attemptsLeft === 2 ? 7 : 4;
            score += addedPoints;
            document.getElementById("score").textContent = score;

            feedbackEl.textContent = `🎉 Correct! (+${addedPoints} pts)`;
            feedbackEl.className = "feedback correct";
            document.getElementById("user-input").disabled = true;

            setTimeout(() => {
                currentIndex++;
                if (currentIndex < quizData.length) {
                    loadQuestion();
                } else {
                    showResults();
                }
            }, 1200);

        } else {
            attemptsLeft--;
            document.getElementById("attempts-display").textContent = `Attempts Left: ${attemptsLeft}/3`;

            if (attemptsLeft > 0) {
                feedbackEl.textContent = `❌ Incorrect spelling! You have ${attemptsLeft} attempt(s) remaining. Try again!`;
                feedbackEl.className = "feedback warning";
                speakCurrentWord();
            } else {
                feedbackEl.innerHTML = `💡 Out of tries! The correct spelling is: <u><strong>${targetWord.toUpperCase()}</strong></u>`;
                feedbackEl.className = "feedback reveal";
                document.getElementById("user-input").disabled = true;
                document.getElementById("submit-btn").disabled = true;

                setTimeout(() => {
                    currentIndex++;
                    if (currentIndex < quizData.length) {
                        loadQuestion();
                    } else {
                        showResults();
                    }
                }, 3500);
            }
        }
    }

    function showResults() {
        document.getElementById("progress-bar").style.width = "100%";
        document.getElementById("game-screen").style.display = "none";
        document.getElementById("results-screen").style.display = "block";
        document.getElementById("final-score").textContent = `Total Score: ${score} / ${quizData.length * 10} Points`;
    }

    function restartGame() {
        currentIndex = 0;
        score = 0;
        document.getElementById("score").textContent = score;
        document.getElementById("game-screen").style.display = "block";
        document.getElementById("results-screen").style.display = "none";
        loadQuestion();
    }

    if ('speechSynthesis' in window) {
        window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
    }

    window.onload = loadQuestion;
</script>

</body>
</html>
