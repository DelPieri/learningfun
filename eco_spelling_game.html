<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eco-Hero Spelling Rescue! 🌿</title>
    <style>
        :root {
            --primary: #2e7d32;
            --primary-light: #a5d6a7;
            --accent: #ff9800;
            --bg: #e8f5e9;
            --card-bg: #ffffff;
            --text: #1b5e20;
            --error: #e53935;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .game-container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 650px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            padding: 30px;
            box-sizing: border-box;
            text-align: center;
            position: relative;
            overflow: hidden;
            border: 4px solid var(--primary-light);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px dashed #c8e6c9;
        }

        .badge {
            background-color: var(--primary-light);
            color: var(--text);
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9em;
        }

        .score-box {
            font-size: 1.2em;
            font-weight: bold;
            color: var(--primary);
        }

        h1 {
            color: var(--primary);
            margin: 10px 0;
            font-size: 1.8em;
        }

        .level-tag {
            display: inline-block;
            background-color: #fff3e0;
            color: #e65100;
            font-size: 0.85em;
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .clue-box {
            background-color: #f1f8e9;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 20px;
            border-left: 5px solid var(--primary);
            text-align: left;
        }

        .sentence-context {
            font-size: 1.15em;
            line-height: 1.5;
            margin-bottom: 10px;
            color: #2c3e50;
        }

        .hint-text {
            font-size: 0.9em;
            color: #666;
            font-style: italic;
        }

        .audio-btn {
            background-color: #81c784;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            margin-bottom: 15px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: transform 0.1s;
        }

        .audio-btn:hover {
            background-color: var(--primary);
            transform: scale(1.03);
        }

        .input-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 15px;
        }

        input[type="text"] {
            font-size: 1.3em;
            padding: 10px 15px;
            border: 2px solid #a5d6a7;
            border-radius: 10px;
            width: 70%;
            text-align: center;
            letter-spacing: 1px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
        }

        .btn-submit {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1em;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn-submit:hover {
            background-color: #1b5e20;
            transform: translateY(-2px);
        }

        .feedback {
            min-height: 40px;
            font-size: 1.1em;
            font-weight: bold;
            margin-top: 10px;
            padding: 8px;
            border-radius: 8px;
        }

        .feedback.correct {
            color: #2e7d32;
            background-color: #e8f5e9;
        }

        .feedback.incorrect {
            color: var(--error);
            background-color: #ffebee;
        }

        .progress-bar-container {
            width: 100%;
            height: 10px;
            background-color: #e0e0e0;
            border-radius: 5px;
            margin-top: 20px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background-color: var(--primary);
            transition: width 0.3s ease;
        }

        .results-screen {
            display: none;
        }

        .results-screen h2 {
            color: var(--primary);
            font-size: 2em;
        }

        .trophy {
            font-size: 4em;
            margin: 10px 0;
        }

        .restart-btn {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.1em;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 20px;
        }

        .restart-btn:hover {
            background-color: #f57c00;
        }
    </style>
</head>
<body>

<div class="game-container">
    <div id="game-screen">
        <div class="header">
            <span class="badge" id="category-badge">Textbook Vocab</span>
            <span class="score-box">🌱 Eco Points: <span id="score">0</span></span>
        </div>

        <h1>Eco-Hero Spelling Rescue! 🌍</h1>
        <div class="level-tag" id="question-count">Question 1 / 15</div>

        <div class="clue-box">
            <div class="sentence-context" id="sentence">Loading sentence...</div>
            <div class="hint-text" id="definition">Loading hint...</div>
        </div>

        <button class="audio-btn" onclick="speakCurrentWord()">
            🔊 Listen to Pronunciation
        </button>

        <form id="spelling-form" onsubmit="checkAnswer(event)">
            <div class="input-group">
                <input type="text" id="user-input" placeholder="Type the correct word here..." autocomplete="off" autofocus />
            </div>
            <button type="submit" class="btn-submit">Submit Answer 🚀</button>
        </form>

        <div class="feedback" id="feedback"></div>

        <div class="progress-bar-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>
    </div>

    <div class="results-screen" id="results-screen">
        <div class="trophy">🏆</div>
        <h2>Awesome Job, Eco-Hero!</h2>
        <p style="font-size: 1.2em;">You saved the planet and mastered your dictation words!</p>
        <p style="font-size: 1.5em; font-weight: bold; color: var(--primary);" id="final-score"></p>
        <button class="restart-btn" onclick="restartGame()">Play Again 🔄</button>
    </div>
</div>

<script>
    // Vocabulary items: Textbook Pages (1-12) + HK P.6 Bonus (13-16)
    const quizData = [
        {
            word: "ecosystems",
            sentence: "We must protect natural ________ such as oceans, rivers, and forests.",
            definition: "Meaning: Biological communities of interacting organisms and their environment.",
            isBonus: false
        },
        {
            word: "deterioration",
            sentence: "Pesticides and pollution cause environmental ________ over time.",
            definition: "Meaning: The process of becoming progressively worse or damaged.",
            isBonus: false
        },
        {
            word: "consumerism",
            sentence: "The rise of mass ________ leads to more trash and wasted natural resources.",
            definition: "Meaning: The practice of buying and using a large amount of goods.",
            isBonus: false
        },
        {
            word: "endangered",
            sentence: "If we do not save their habitats, these tigers will become ________.",
            definition: "Meaning: At risk of extinction.",
            isBonus: false
        },
        {
            word: "coexisted",
            sentence: "For millions of years, animals and plants ________ in natural balance.",
            definition: "Meaning: Lived together peacefully in the same time or place.",
            isBonus: false
        },
        {
            word: "campaign",
            sentence: "Our school started a recycling ________ to reduce plastic waste.",
            definition: "Meaning: An organized set of actions to achieve a specific goal.",
            isBonus: false
        },
        {
            word: "broccoli",
            sentence: "RSPCA suggests feeding rabbits fresh vegetables like ________ and cabbage.",
            definition: "Meaning: A green leafy vegetable with edible flower heads.",
            isBonus: false
        },
        {
            word: "spinach",
            sentence: "Packed cups of dark leafy green greens like ________ are healthy for pets.",
            definition: "Meaning: A green leafy vegetable rich in vitamins.",
            isBonus: false
        },
        {
            word: "rinse",
            sentence: "Turn off the tap while brushing, and turn it on only to ________ your mouth.",
            definition: "Meaning: To wash lightly with quick water.",
            isBonus: false
        },
        {
            word: "extinct",
            sentence: "Dinosaurs are ________ animals that no longer exist on Earth today.",
            definition: "Meaning: Having no living members remaining.",
            isBonus: false
        },
        {
            word: "compost",
            sentence: "Fruit peels and vegetable scraps can go into ________ bins.",
            definition: "Meaning: Decayed organic material used as plant fertilizer.",
            isBonus: false
        },
        {
            word: "threatened",
            sentence: "Illegal hunting leaves many rare forest creatures severely ________.",
            definition: "Meaning: Vulnerable or in danger of being harmed.",
            isBonus: false
        },
        // HK P.6 Common Daily/Exam Vocab Bonus Round
        {
            word: "conservation",
            sentence: "🌟 [BONUS P.6] Wildlife ________ helps protect wild animals and forest lands.",
            definition: "Meaning: The protection and preservation of the environment.",
            isBonus: true
        },
        {
            word: "biodiversity",
            sentence: "🌟 [BONUS P.6] Tropical rainforests have a rich ________ with thousands of species.",
            definition: "Meaning: The variety of plant and animal life in a habitat.",
            isBonus: true
        },
        {
            word: "temperature",
            sentence: "🌟 [BONUS P.6] Global warming causes the Earth's average ________ to rise.",
            definition: "Meaning: The degree of hotness or coldness measured by a thermometer.",
            isBonus: true
        },
        {
            word: "electricity",
            sentence: "🌟 [BONUS P.6] Turn off lights when leaving the room to save ________.",
            definition: "Meaning: Energy used to power lights, appliances, and devices.",
            isBonus: true
        }
    ];

    let currentIndex = 0;
    let score = 0;

    function loadQuestion() {
        const item = quizData[currentIndex];
        document.getElementById("user-input").value = "";
        document.getElementById("feedback").textContent = "";
        document.getElementById("feedback").className = "feedback";
        
        document.getElementById("sentence").textContent = item.sentence;
        document.getElementById("definition").textContent = item.definition;
        document.getElementById("question-count").textContent = `Question ${currentIndex + 1} / ${quizData.length}`;
        
        const badge = document.getElementById("category-badge");
        if (item.isBonus) {
            badge.textContent = "⭐ HK P.6 Bonus Challenge";
            badge.style.backgroundColor = "#ffe082";
            badge.style.color = "#e65100";
        } else {
            badge.textContent = "📖 Dictation Textbook Vocab";
            badge.style.backgroundColor = "#a5d6a7";
            badge.style.color = "#1b5e20";
        }

        const progressPercent = ((currentIndex) / quizData.length) * 100;
        document.getElementById("progress-bar").style.width = progressPercent + "%";

        // Speak word automatically after a small delay
        setTimeout(() => {
            speakCurrentWord();
        }, 400);
    }

    function speakCurrentWord() {
        const word = quizData[currentIndex].word;
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel(); // Stop any overlapping audio
            
            const utterance = new SpeechSynthesisUtterance(word);
            const voices = window.speechSynthesis.getVoices();
            
            // 1. Try to find a high-quality "Natural", "Google", "Enhanced", or standard US/UK English voice
            let selectedVoice = voices.find(voice => 
                voice.lang.startsWith('en') && 
                (voice.name.includes('Natural') || voice.name.includes('Google') || voice.name.includes('Enhanced') || voice.name.includes('Samantha') || voice.name.includes('Karen'))
            );

            // 2. Fallback to any English voice if a premium one isn't found
            if (!selectedVoice) {
                selectedVoice = voices.find(voice => voice.lang.startsWith('en'));
            }

            if (selectedVoice) {
                utterance.voice = selectedVoice;
            }

            utterance.lang = 'en-US';
            utterance.rate = 0.95; // Natural clear reading speed
            utterance.pitch = 1.0;  // Standard natural pitch

            window.speechSynthesis.speak(utterance);
        }
    }

    // Ensure voices are loaded properly in Chrome / Safari
    if ('speechSynthesis' in window) {
        window.speechSynthesis.onvoiceschanged = () => {
            window.speechSynthesis.getVoices();
        };
    }


    function checkAnswer(e) {
        e.preventDefault();
        const userInput = document.getElementById("user-input").value.trim().toLowerCase();
        const targetWord = quizData[currentIndex].word.toLowerCase();
        const feedbackEl = document.getElementById("feedback");

        if (!userInput) return;

        if (userInput === targetWord) {
            score += quizData[currentIndex].isBonus ? 15 : 10;
            document.getElementById("score").textContent = score;
            feedbackEl.textContent = "🎉 Excellent! Correct Spelling!";
            feedbackEl.className = "feedback correct";

            setTimeout(() => {
                currentIndex++;
                if (currentIndex < quizData.length) {
                    loadQuestion();
                } else {
                    showResults();
                }
            }, 1200);
        } else {
            // Provide helpful spelling hint
            feedbackEl.textContent = `❌ Oops! Correct spelling: "${targetWord}". Try typing it again!`;
            feedbackEl.className = "feedback incorrect";
            speakCurrentWord();
        }
    }

    function showResults() {
        document.getElementById("progress-bar").style.width = "100%";
        document.getElementById("game-screen").style.display = "none";
        document.getElementById("results-screen").style.display = "block";
        document.getElementById("final-score").textContent = `Final Eco Score: ${score} Points!`;
    }

    function restartGame() {
        currentIndex = 0;
        score = 0;
        document.getElementById("score").textContent = score;
        document.getElementById("game-screen").style.display = "block";
        document.getElementById("results-screen").style.display = "none";
        loadQuestion();
    }

    // Initialize on page load
    window.onload = loadQuestion;
</script>

</body>
</html>
